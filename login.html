<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Management Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-card">

    <h1>Church Management</h1>

    <form id="loginForm">

        <input
            id="email"
            aria-label="Email"
            autocomplete="username"
            type="email"
            placeholder="Email"
            required>

        <input
            id="password"
            aria-label="Password"
            autocomplete="current-password"
            type="password"
            placeholder="Password"
            required>

        <button type="submit" class="primary-btn">
            Sign In
        </button>

    </form>

    <p id="loginError" class="form-feedback" role="alert" aria-live="polite"></p>

</div>

<script type="module" src="login.js"></script>

<div id="toastRegion" class="toast-region" aria-live="polite" aria-relevant="additions" aria-label="Notifications"></div>
</body>
</html>
