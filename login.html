<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Church Management Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-card">

    <h1>Church Management</h1>

    <form id="loginForm">

        <input
            id="email"
            type="email"
            placeholder="Email"
            required>

        <input
            id="password"
            type="password"
            placeholder="Password"
            required>

        <button type="submit">
            Sign In
        </button>

    </form>

    <p id="loginError"></p>

</div>

<script src="auth.js"></script>
<script src="login.js"></script>

</body>
</html>
